<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi día">
<link rel="manifest" href="manifest.json">
<title>Mi día — Asistente personal</title>
<style>
  :root {
    --fondo: #05070f;
    --tarjeta: #131a33;
    --tarjeta-alta: #1a2247;
    --texto: #e8ecfa;
    --texto-suave: #a3addc;
    --borde: #2c3768;
    --entrenamiento: #35e0a1;
    --docencia: #4d9fff;
    --reunion: #8f8fff;
    --comida: #ffb454;
    --familia: #c792ff;
    --otro: #6b7fd6;
    --alerta: #ff5d7a;
    --alerta-bg: #2a1420;
    --urgente: #ff3d68;
    --mio: #ffd23f;          /* dorado: temas que tiene que cumplir Marce */
    --mio-bg: #2b2410;
  }
  * { box-sizing: border-box; }
  html, body { overscroll-behavior-y: contain; }
  html { background: var(--fondo); }
  body {
    margin: 0; min-height: 100vh;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--texto);
    padding: max(20px, env(safe-area-inset-top)) 16px 60px;
    -webkit-font-smoothing: antialiased;
    /* Brillos de color en las esquinas y una grilla tenue, estilo futurista */
    background-color: var(--fondo);
    background-image:
      radial-gradient(circle at 10% -5%, rgba(77,159,255,.26), transparent 42%),
      radial-gradient(circle at 92% 12%, rgba(199,146,255,.20), transparent 40%),
      radial-gradient(circle at 50% 108%, rgba(53,224,161,.12), transparent 45%),
      linear-gradient(rgba(77,159,255,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(77,159,255,.055) 1px, transparent 1px);
    background-size: auto, auto, auto, 34px 34px, 34px 34px;
    background-repeat: no-repeat, no-repeat, no-repeat, repeat, repeat;
  }
  .contenedor { max-width: 580px; margin: 0 auto; }

  header { margin-bottom: 18px; }
  .fecha { font-size: 15px; color: var(--texto-suave); text-transform: capitalize; }
  h1 {
    font-size: 27px; margin: 3px 0 0; letter-spacing: -0.3px;
    background: linear-gradient(90deg, var(--texto) 0%, var(--docencia) 55%, var(--familia) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 26px rgba(77,159,255,.35);
    display: inline-block;
  }

  h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--texto-suave); margin: 30px 0 10px; font-weight: 600;
  }

  .destacado {
    background: var(--tarjeta); border: 1px solid rgba(77,159,255,.35);
    border-radius: 16px; padding: 16px 18px; margin-bottom: 8px;
    box-shadow: 0 0 22px rgba(77,159,255,.18), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .destacado .etiqueta { font-size: 12.5px; color: var(--texto-suave); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.6px; }
  .destacado .titulo { font-size: 19px; font-weight: 600; line-height: 1.25; }
  .destacado .detalle { font-size: 14.5px; color: var(--texto-suave); margin-top: 5px; }

  /* Aviso de salida — el que insiste */
  .aviso {
    background: linear-gradient(135deg, var(--urgente), #ff7a3d); color: #fff;
    border-radius: 16px; padding: 18px;
    margin-bottom: 14px; text-align: center;
    box-shadow: 0 0 30px rgba(255,61,104,.45);
    animation: latir 1.6s ease-in-out infinite;
  }
  .aviso .grande { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .aviso .chico { font-size: 14px; opacity: .9; margin-top: 6px; }
  .aviso.calmo { background: var(--tarjeta); color: var(--texto); border: 2px solid var(--urgente); animation: none; }
  @keyframes latir { 0%,100% { transform: scale(1); } 50% { transform: scale(1.015); } }
  @media (prefers-reduced-motion: reduce) { .aviso { animation: none; } }

  .salida {
    display: flex; align-items: center; gap: 7px;
    font-size: 14px; color: var(--texto-suave); margin: 13px 0 5px 4px;
  }
  .salida b { color: var(--texto); font-variant-numeric: tabular-nums; }
  .salida .ok { color: var(--entrenamiento); font-weight: 600; }
  .salida .tarde { color: var(--alerta); font-weight: 600; }

  .evento {
    background: var(--tarjeta); border: 1px solid var(--borde);
    border-left: 5px solid var(--otro); border-radius: 12px;
    padding: 13px 15px; margin-bottom: 9px;
  }
  /* Cada categoría tiene su color, y un resplandor tenue que sale del borde */
  .evento.entrenamiento { border-left-color: var(--entrenamiento); box-shadow: inset 4px 0 14px -8px var(--entrenamiento); }
  .evento.docencia      { border-left-color: var(--docencia);      box-shadow: inset 4px 0 14px -8px var(--docencia); }
  .evento.reunion       { border-left-color: var(--reunion);       box-shadow: inset 4px 0 14px -8px var(--reunion); }
  .evento.comida        { border-left-color: var(--comida);        box-shadow: inset 4px 0 14px -8px var(--comida); }
  .evento.familia       { border-left-color: var(--familia);       box-shadow: inset 4px 0 14px -8px var(--familia); }
  /* Los bloques de trabajo vienen del calendario pero se ven distintos:
     no son un compromiso con otro, son tiempo tuyo reservado. */
  .evento.trabajo {
    background: transparent; border: 1px dashed #303a68; border-left: 1px dashed #303a68;
  }
  .evento.pasado        { opacity: .45; }
  .evento.enCurso       { box-shadow: 0 0 0 2px rgba(53,224,161,.4), 0 0 16px rgba(53,224,161,.25); }
  .evento .hora { font-size: 13px; font-weight: 600; color: var(--texto-suave); font-variant-numeric: tabular-nums; }
  .evento .titulo { font-size: 17px; font-weight: 600; margin-top: 2px; line-height: 1.3; }
  .evento .lugar { font-size: 14px; color: var(--texto-suave); margin-top: 3px; }
  .evento .desc {
    font-size: 13.5px; color: var(--texto-suave); margin-top: 8px; padding-top: 8px;
    border-top: 1px solid var(--borde); white-space: pre-wrap; line-height: 1.45;
  }
  .badge {
    display: inline-block; font-size: 11.5px; font-weight: 600;
    padding: 2px 7px; border-radius: 6px; margin-left: 6px;
    background: rgba(53,224,161,.15); color: var(--entrenamiento); vertical-align: middle;
    box-shadow: 0 0 10px rgba(53,224,161,.35);
  }
  .badge.sinResp { background: rgba(255,180,84,.15); color: var(--comida); box-shadow: 0 0 10px rgba(255,180,84,.35); }

  /* Bloque del programa de clases dentro de cada evento */
  .clase {
    margin-top: 9px; padding: 10px 12px; border-radius: 9px;
    background: #171e40; border: 1px solid var(--borde); font-size: 14px; line-height: 1.45;
  }
  .clase + .clase { margin-top: 6px; }
  .clase.mia { background: rgba(77,159,255,.12); border-color: rgba(77,159,255,.4); }
  .clase .quien {
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.6px;
    text-transform: uppercase; margin-bottom: 3px;
  }
  .clase.mia .quien  { color: var(--docencia); }
  .clase.otro .quien { color: var(--texto-suave); }
  .clase .tema { font-weight: 600; color: var(--texto); }
  .clase .meta { font-size: 12.5px; color: var(--texto-suave); margin-top: 3px; }

  /* Invitaciones que todavía no contestaste */
  .invitaciones {
    background: rgba(255,180,84,.08); border: 1px solid rgba(255,180,84,.3);
    border-radius: 16px; padding: 15px 17px; margin-bottom: 14px;
  }
  .invitaciones .etiqueta {
    font-size: 12.5px; color: var(--comida); margin-bottom: 9px;
    text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600;
  }
  .invita + .invita { margin-top: 11px; padding-top: 11px; border-top: 1px solid rgba(255,180,84,.25); }
  .invita .que { font-size: 16px; font-weight: 600; line-height: 1.3; }
  .invita .cuando { font-size: 13.5px; color: var(--texto-suave); margin-top: 3px; }
  .invita .dequien { font-size: 13px; color: var(--texto-suave); margin-top: 2px; }
  .abrirCal {
    display: inline-block; margin-top: 12px; font-size: 13.5px; font-weight: 600;
    color: var(--comida); text-decoration: none;
    border: 1px solid rgba(255,180,84,.3); border-radius: 8px; padding: 7px 13px;
    background: var(--tarjeta);
  }

  /* Partidos y carreras. Se miran, no ocupan el día. */
  .evento.deporte { border-left-color: var(--familia); background: rgba(199,146,255,.06); }
  .depDia {
    font-size: 12.5px; font-weight: 700; color: var(--texto-suave);
    text-transform: capitalize; margin: 12px 0 5px 3px;
  }
  .dep {
    display: flex; gap: 11px; align-items: baseline;
    background: var(--tarjeta); border: 1px solid var(--borde);
    border-left: 4px solid var(--familia); border-radius: 10px;
    padding: 9px 13px; margin-bottom: 6px;
    box-shadow: inset 4px 0 14px -8px var(--familia);
  }
  .dep .depHora {
    font-size: 13.5px; font-weight: 700; color: var(--texto-suave);
    font-variant-numeric: tabular-nums; flex: 0 0 auto;
  }
  .dep .depQue { font-size: 14.5px; line-height: 1.35; }

  /* Alguien cubre la clase de otro porque el titular está en FLACSO */
  .cubre {
    font-size: 12px; color: var(--texto-suave); margin-top: 5px;
    background: rgba(255,255,255,.05); border-radius: 6px; padding: 4px 7px;
  }

  /* Huecos convertidos en bloques de trabajo */
  .trabajo {
    border: 1px dashed #303a68; border-radius: 12px; padding: 12px 15px;
    margin-bottom: 9px; background: transparent;
  }
  .trabajo .hora { font-size: 13px; font-weight: 600; color: var(--texto-suave); font-variant-numeric: tabular-nums; }
  .trabajo .titulo { font-size: 16px; font-weight: 600; margin-top: 2px; color: var(--texto); }
  .trabajo .nota { font-size: 13px; color: var(--texto-suave); margin-top: 3px; }
  .trabajo.pasado { opacity: .4; }

  /* Clases de otras sedes, sólo informativas */
  .otraSede {
    background: var(--tarjeta); border: 1px solid var(--borde);
    border-left: 5px solid var(--docencia); border-radius: 12px;
    padding: 12px 15px; margin-bottom: 9px; opacity: .8;
    box-shadow: inset 4px 0 14px -8px var(--docencia);
  }
  .otraSede .hora { font-size: 13px; font-weight: 600; color: var(--texto-suave); }
  .otraSede .titulo { font-size: 15.5px; font-weight: 600; margin-top: 2px; }
  .otraSede .meta { font-size: 13px; color: var(--texto-suave); margin-top: 3px; }

  /* Sugerencia de comida */
  .comidaSug {
    margin-top: 9px; padding: 11px 13px; border-radius: 9px;
    background: rgba(255,180,84,.08); border: 1px solid rgba(255,180,84,.3); font-size: 14px; line-height: 1.45;
  }
  .comidaSug .quien {
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.6px;
    text-transform: uppercase; margin-bottom: 3px; color: var(--comida);
  }
  .comidaSug .plato { font-weight: 600; color: var(--texto); }
  .comidaSug .datos { font-size: 12.5px; color: var(--texto-suave); margin-top: 3px; }
  .comidaSug .pasos { font-size: 13px; color: var(--texto-suave); margin-top: 6px; }
  .comidaSug .otra {
    font-size: 13px; color: var(--texto-suave); margin-top: 8px;
    padding-top: 8px; border-top: 1px solid rgba(255,180,84,.25);
  }

  /* Planes B y C */
  .cumplio { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .cumplio button {
    font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
    border-radius: 8px; padding: 7px 13px; border: 1px solid var(--borde);
    background: var(--tarjeta); color: var(--texto);
  }
  .cumplio button.si { border-color: rgba(53,224,161,.45); color: var(--entrenamiento); }
  .cumplio button.no { border-color: rgba(255,93,122,.45); color: var(--alerta); }

  .marcado {
    margin-top: 10px; font-size: 13.5px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .marcado.ok   { color: var(--entrenamiento); }
  .marcado.alt  { color: var(--comida); }
  .marcado.perd { color: var(--texto-suave); }
  .marcado button {
    font: inherit; font-size: 12px; font-weight: 500; cursor: pointer;
    background: none; border: none; color: var(--texto-suave);
    text-decoration: underline; padding: 0;
  }

  .planes { margin-top: 10px; }
  .plan {
    display: flex; gap: 11px; align-items: flex-start;
    padding: 11px 12px; border-radius: 9px; margin-bottom: 7px;
    background: #171e40; border: 1px solid var(--borde);
    cursor: pointer; text-align: left; width: 100%; font: inherit;
  }
  .plan:hover { border-color: var(--docencia); }
  .plan .letra {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
    background: var(--docencia); color: #071022; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .plan .que { font-weight: 600; font-size: 14.5px; color: var(--texto); }
  .plan .cuando { font-size: 13px; color: var(--texto); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .plan .porque { font-size: 12.5px; color: var(--texto-suave); margin-top: 3px; line-height: 1.4; }

  /* Resumen de la semana */
  .semanaResumen {
    background: var(--tarjeta); border: 1px solid var(--borde);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 9px;
  }
  .semanaResumen .cifras { display: flex; gap: 18px; margin-top: 8px; flex-wrap: wrap; }
  .semanaResumen .cifra { font-size: 13px; color: var(--texto-suave); }
  .semanaResumen .cifra b { display: block; font-size: 21px; color: var(--texto); font-weight: 700; }

  /* Ejercicios de la rutina */
  .ejercicios { margin-top: 10px; }
  .ejGrupo {
    font-size: 11.5px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
    color: var(--texto-suave); margin: 11px 0 5px;
  }
  .ejercicios a {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 8px; margin-bottom: 5px;
    background: #171e40; border: 1px solid var(--borde);
    color: var(--texto); text-decoration: none; font-size: 14px;
  }
  .ejercicios a span.play { color: var(--entrenamiento); font-size: 13px; font-weight: 600; flex-shrink: 0; }

  /* Días futuros desplegables */
  .diaSemana { cursor: pointer; }
  .diaSemana .flecha { color: var(--texto-suave); font-size: 12px; flex-shrink: 0; }
  .detalleDia {
    background: var(--tarjeta); border: 1px solid var(--borde); border-top: none;
    border-radius: 0 0 10px 10px; padding: 4px 14px 12px; margin: -7px 0 6px;
    font-size: 13.5px; color: var(--texto-suave);
  }
  .detalleDia .linea { display: flex; gap: 10px; padding: 4px 0; }
  .detalleDia .linea b { color: var(--texto); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .detalleDia .sal { color: var(--alerta); font-size: 12.5px; }

  /* Temas de reunión */
  .reuCabecera {
    background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px;
    padding: 13px 15px; display: flex; align-items: center; gap: 12px;
    cursor: pointer; font-size: 15px;
  }
  .reuCabecera.hayVencidos { border-color: rgba(255,93,122,.5); background: rgba(255,93,122,.08); box-shadow: 0 0 16px rgba(255,93,122,.25); }
  .reuCabecera .titulo { font-weight: 600; flex: 1; }
  .reuCabecera .cuenta { font-size: 13px; color: var(--texto-suave); }
  .reuCabecera .cuenta b { color: var(--alerta); }

  .reuGrupo {
    font-size: 11.5px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
    color: var(--texto-suave); margin: 16px 0 6px;
  }
  .tema {
    background: var(--tarjeta); border: 1px solid var(--borde);
    border-left: 4px solid var(--otro); border-radius: 10px;
    padding: 11px 13px; margin-bottom: 6px; font-size: 14px; line-height: 1.4;
  }
  /* Los temas de Marce (responsable él o "Todos") van en dorado, bien visibles.
     Va antes de vencido/pronto para que el borde izquierdo rojo o naranja se siga viendo. */
  .tema.mio {
    background: var(--mio-bg); border-color: var(--mio);
    box-shadow: 0 0 14px -4px rgba(255,210,63,.55);
  }
  .tema.mio .nombre { color: #fff3c4; }
  .tema .tuyo {
    display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .5px;
    text-transform: uppercase; color: #1a1400; background: var(--mio);
    border-radius: 6px; padding: 1px 7px; margin-right: 6px; vertical-align: 1px;
  }
  .reuCabecera .cuenta .tuyos { color: var(--mio); font-weight: 700; }
  .tema.vencido { border-left-color: var(--alerta); box-shadow: inset 4px 0 14px -8px var(--alerta); }
  .tema.pronto  { border-left-color: var(--comida); box-shadow: inset 4px 0 14px -8px var(--comida); }
  .tema.falta   { border-left-color: var(--otro); border-style: dashed; }
  .tema.cerrado { opacity: .55; }
  .tema .nombre { font-weight: 600; color: var(--texto); }
  .tema .meta { font-size: 12.5px; color: var(--texto-suave); margin-top: 3px; }
  .tema .plazo { font-weight: 600; }
  .tema .plazo.rojo { color: var(--alerta); }
  .tema .plazo.naranja { color: var(--comida); }
  .tema .falta1 { font-size: 12.5px; color: var(--alerta); margin-top: 3px; }
  .tema .detalle { font-size: 12.5px; color: var(--texto-suave); margin-top: 5px; }

  /* Aviso de soltar el teléfono */
  .noche {
    background: linear-gradient(135deg, #0d0221, #1a0b3d); color: var(--texto);
    border: 1px solid rgba(199,146,255,.4); box-shadow: 0 0 24px rgba(199,146,255,.2);
    border-radius: 16px; padding: 18px; margin-bottom: 14px; text-align: center;
  }
  .noche .grande { font-size: 19px; font-weight: 700; }
  .noche .chico { font-size: 14px; opacity: .85; margin-top: 5px; }

  .alerta {
    background: var(--alerta-bg); border: 1px solid rgba(255,93,122,.35); border-radius: 12px;
    padding: 12px 15px; margin-bottom: 9px; font-size: 14px;
    color: var(--alerta); line-height: 1.45;
  }

  .semana { display: flex; flex-direction: column; gap: 6px; }
  .diaSemana {
    background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 10px;
    padding: 10px 14px; display: flex; align-items: center; gap: 12px; font-size: 14.5px;
  }
  .diaSemana .nombre { width: 72px; font-weight: 600; text-transform: capitalize; flex-shrink: 0; }
  .diaSemana .contenido { color: var(--texto-suave); flex: 1; }
  .diaSemana.hoy { border-color: var(--docencia); background: rgba(77,159,255,.08); box-shadow: 0 0 16px rgba(77,159,255,.25); }

  .estado { text-align: center; color: var(--texto-suave); padding: 40px 10px; font-size: 15px; line-height: 1.6; }

  /* Pantalla de configuración inicial */
  .setup {
    background: var(--tarjeta); border: 1px solid rgba(77,159,255,.35); border-radius: 16px; padding: 22px;
    box-shadow: 0 0 22px rgba(77,159,255,.18), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .setup h3 { margin: 0 0 10px; font-size: 19px; }
  .setup p { font-size: 14.5px; color: var(--texto-suave); line-height: 1.55; margin: 0 0 14px; }
  .setup input {
    width: 100%; font: inherit; font-size: 15px; padding: 12px;
    border: 1px solid var(--borde); border-radius: 10px; margin-bottom: 12px;
    background: var(--fondo); color: var(--texto);
  }
  .boton {
    font: inherit; font-size: 15px; font-weight: 600;
    background: linear-gradient(135deg, var(--docencia), #8a5cff); color: #071022;
    border: none; border-radius: 10px;
    box-shadow: 0 4px 22px rgba(77,159,255,.45), 0 0 0 1px rgba(138,92,255,.35);
    padding: 12px 20px; cursor: pointer; width: 100%;
  }
  .boton.secundario { background: var(--tarjeta); color: var(--texto); border: 1px solid var(--borde); font-weight: 500; box-shadow: none; }

  .ajustes { margin-top: 34px; display: flex; flex-direction: column; gap: 8px; }
  .ajustes .boton { font-size: 14px; padding: 10px 16px; }
  .pie { text-align: center; font-size: 12.5px; color: var(--texto-suave); margin-top: 20px; line-height: 1.6; }
</style>
</head>
<body>
<div class="contenedor">
  <header>
    <div class="fecha" id="fecha">&nbsp;</div>
    <h1 id="encabezado">Tu día</h1>
  </header>

  <div id="app"><div class="estado">Cargando…</div></div>
</div>

<script src="programa.js?v=39"></script>
<script src="comidas.js?v=39"></script>
<script src="app.js?v=39"></script>
<script src="salidas.js?v=39"></script>
<script src="planes.js?v=39"></script>
<script src="ejercicios.js?v=39"></script>

<script src="reuniones.js?v=39"></script>
<script>
let EVENTOS = [];
let CRONOMETRO = null;

// ───────── Arranque ─────────
// Si la dirección trae #cal=..., la guardamos y la borramos de la barra,
// para no tener que copiar el link a mano en el teléfono.
function configuracionPorEnlace() {
  const m = location.hash.match(/[#&]cal=([^&]+)/);
  if (!m) return false;
  try {
    const url = decodeURIComponent(m[1]);
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url)) return false;
    Guardado.escribir('urlCalendario', url);
    history.replaceState(null, '', location.pathname);
    return true;
  } catch { return false; }
}

function arrancar() {
  configuracionPorEnlace();
  const url = Guardado.leer('urlCalendario', null);
  if (!url) return mostrarSetup();

  document.getElementById('app').innerHTML = '<div class="estado">Leyendo tu calendario…</div>';
  fetch(url)
    .then(r => {
      if (!r.ok) throw new Error('El servidor respondió ' + r.status);
      return r.json();
    })
    .then(crudos => {
      EVENTOS = prepararEventos(crudos);
      Guardado.escribir('ultimaCopia', crudos);
      dibujar();
      if (CRONOMETRO) clearInterval(CRONOMETRO);
      CRONOMETRO = setInterval(dibujar, 30000);   // se refresca solo cada 30 s
    })
    .catch(err => {
      const copia = Guardado.leer('ultimaCopia', null);
      if (copia) {
        EVENTOS = prepararEventos(copia);
        dibujar(true);
      } else {
        document.getElementById('app').innerHTML =
          `<div class="estado">No pude leer el calendario.<br><br>
           <span style="font-size:13px">${esc(err.message)}</span></div>
           <div class="ajustes"><button class="boton secundario" onclick="cambiarLink()">Cambiar el link del calendario</button></div>`;
      }
    });
}

// ───────── Pantalla de configuración ─────────
function mostrarSetup() {
  document.getElementById('encabezado').textContent = 'Configuración';
  document.getElementById('app').innerHTML = `
    <div class="setup">
      <h3>Conectá tu calendario</h3>
      <p>Pegá el link de tu Google Calendar (el que termina en <b>/exec</b>).
         Se guarda solo en este teléfono: no viaja a ningún lado ni queda en el código de la app.</p>
      <input id="entradaUrl" type="url" inputmode="url" autocomplete="off"
             placeholder="https://script.google.com/macros/s/.../exec">
      <button class="boton" onclick="guardarLink()">Guardar y entrar</button>
      <p id="errorSetup" style="color:var(--alerta); margin:12px 0 0"></p>
    </div>`;
}

function guardarLink() {
  const valor = document.getElementById('entradaUrl').value.trim();
  const error = document.getElementById('errorSetup');
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(valor)) {
    error.textContent = 'Ese link no tiene la forma esperada. Tiene que empezar con https://script.google.com/macros/s/ y terminar en /exec';
    return;
  }
  Guardado.escribir('urlCalendario', valor);
  arrancar();
}

function cambiarLink() {
  localStorage.removeItem('marce.urlCalendario');
  localStorage.removeItem('marce.ultimaCopia');
  mostrarSetup();
}

// ───────── Dibujar la pantalla ─────────
function dibujar(sinConexion) {
  const ahora = new Date();
  const hoy = partes(ahora);

  document.getElementById('encabezado').textContent = 'Tu día';
  document.getElementById('fecha').textContent =
    `${hoy.diaSemana} ${hoy.dia} de ${NOMBRES_MES[hoy.mes]}`;

  const porDia = {};
  for (const ev of EVENTOS) (porDia[ev.clave] ||= []).push(ev);

  const html = [];

  if (sinConexion) {
    html.push(`<div class="alerta">Sin conexión — te muestro la última copia que guardé.</div>`);
  }

  // ── Aviso de la noche: soltar el teléfono ──
  Noche.revisar(hoy, () => dibujar());
  if (Noche.yaAvisoHoy(hoy.clave)) {
    html.push(`<div class="noche">
      <div class="grande">📵 Teléfono a cargar</div>
      <div class="chico">Estás en casa y pasaron las 22. Dejalo cargando hasta mañana.</div>
    </div>`);
  }

  // ── Aviso de salida (lo que insiste) ──
  const vigilado = Salidas.vigilar(EVENTOS, hoy, () => dibujar());
  if (vigilado) {
    const faltan = vigilado.minSalida - hoy.minutos;
    Salidas.revisarAvisos(vigilado, hoy.minutos);
    const tieneGPS = !!Salidas.casa();
    if (faltan <= AVISO_ANTES) {
      html.push(`<div class="aviso ${faltan > 0 ? 'calmo' : ''}">
        <div class="grande">${faltan > 0
          ? `Andá saliendo — ${duracionTexto(faltan)}`
          : faltan === 0 ? 'Salí ahora' : `Vas ${duracionTexto(-faltan)} tarde`}</div>
        <div class="chico">${esc(vigilado.titulo)} · salida prevista ${vigilado.salida}${
          tieneGPS ? '' : ' · marcá tu casa abajo para que detecte cuándo salís'}</div>
      </div>`);
    } else {
      html.push(`<div class="destacado">
        <div class="etiqueta">Próxima salida · vigilando</div>
        <div class="titulo">${vigilado.salida} — ${esc(vigilado.titulo)}</div>
        <div class="detalle">Faltan ${duracionTexto(faltan)}. Te aviso ${AVISO_ANTES} min antes${
          tieneGPS ? ' y registro cuándo saliste.' : '.'}</div>
      </div>`);
    }
  }

  // ── Invitaciones esperando respuesta ──
  const pendientes = invitacionesPendientes(EVENTOS, hoy.clave);
  if (pendientes.length) {
    html.push(`<div class="invitaciones">
      <div class="etiqueta">📨 Te están esperando (${pendientes.length})</div>
      ${pendientes.map(e => {
        const quien = nombreDeMail(e.invitaba);
        const cuando = cuandoEs(hoy.clave, e.clave);
        return `<div class="invita">
          <div class="que">${esc(e.titulo)}</div>
          <div class="cuando">${esc(cuando)}${
            e.todoElDia ? '' : ' · ' + esc(e.hhmmIni) + '–' + esc(e.hhmmFin)}${
            e.lugar ? ' · ' + esc(e.lugar) : ''}</div>
          ${quien ? `<div class="dequien">Te invitó ${esc(quien)}</div>` : ''}
          ${e.quizas ? '<div class="dequien">Contestaste «quizás».</div>' : ''}
        </div>`;
      }).join('')}
      <a class="abrirCal" target="_blank" rel="noopener"
         href="https://calendar.google.com/calendar/r">Responder en el calendario</a>
    </div>`);
  }

  // ── Lo próximo ──
  const proximo = EVENTOS.find(ev => ev.fin > ahora && !ev.todoElDia);
  if (proximo && (!vigilado || vigilado.id !== proximo.id || proximo.minSalida - hoy.minutos > AVISO_ANTES)) {
    const enCurso = proximo.ini <= ahora;
    const esHoy = proximo.clave === hoy.clave;
    let etiqueta, detalle;
    if (enCurso) {
      etiqueta = 'Ahora mismo';
      detalle = `Termina ${proximo.hhmmFin} · quedan ${duracionTexto(Math.round((proximo.fin - ahora) / 60000))}`;
    } else {
      // Ojo: no todo lo que no es hoy es mañana. Un sábado a la noche lo
      // próximo cae el lunes, porque el domingo es día de descanso.
      etiqueta = esHoy
        ? `Lo próximo · en ${duracionTexto(Math.round((proximo.ini - ahora) / 60000))}`
        : `Lo próximo · ${cuandoEs(hoy.clave, proximo.clave)}`;
      detalle = `${proximo.hhmmIni}–${proximo.hhmmFin}`;
    }
    if (proximo.lugar) detalle += ` · ${proximo.lugar}`;
    html.push(`<div class="destacado">
      <div class="etiqueta">${etiqueta}</div>
      <div class="titulo">${esc(proximo.titulo)}</div>
      <div class="detalle">${esc(detalle)}</div>
    </div>`);
  }

  // ── Hoy ──
  const deHoy = porDia[hoy.clave] || [];
  html.push('<h2>Hoy</h2>');
  if (!deHoy.length) {
    html.push('<div class="estado" style="padding:24px 10px">Ya no te queda nada por hoy.</div>');
  } else {
    for (const a of detectarAlertas(deHoy)) html.push(`<div class="alerta">${esc(a)}</div>`);
    // El día se arma intercalando eventos, huecos de trabajo y clases de otras sedes,
    // todo ordenado por hora para que se lea de corrido.
    const piezas = [];
    for (const b of bloquesDeTrabajo(deHoy)) {
      piezas.push({ orden: b.minIni, html: `<div class="trabajo ${hoy.minutos > b.minFin ? 'pasado' : ''}">
        <div class="hora">${b.desde} – ${b.hasta}</div>
        <div class="titulo">🗂️ Bloque de trabajo</div>
        <div class="nota">${duracionTexto(b.minutos)} libres. Preparación de clases, armado de curso, devoluciones.</div>
      </div>` });
    }
    for (const c of clasesInformativas(deHoy, hoy.clave)) {
      const [h] = c.sede.hora.split('–');
      const min = Number(h.slice(0,2)) * 60 + Number(h.slice(3,5));
      piezas.push({ orden: min, html: `<div class="otraSede">
        <div class="hora">${esc(c.sede.hora)}</div>
        <div class="titulo">${esc(c.sede.nombre)} · ${esc(c.sede.detalle)}</div>
        <div class="meta">Da ${esc(c.responsable)} — ${esc(c.tema)}</div>
        ${c.cubreA ? '<div class="cubre">🔄 cubre a ' + esc(c.cubreA) + '</div>' : ''}
      </div>` });
    }
    // Clase tuya que el calendario no refleja (ej: ese jueves das en FLACSO, no en Delfos)
    for (const c of clasesSinEvento(deHoy, hoy.clave)) {
      html.push(`<div class="alerta">Hoy das clase en <b>${esc(c.sede ? c.sede.nombre : c.sedeCod)}</b>
        de ${esc(c.sede ? c.sede.hora : '')} — «${esc(c.tema)}» — y eso no figura en tu calendario.</div>`);
    }
    const registro = Salidas.registro();
    for (const ev of deHoy) {
      let bloque = '';
      if (ev.salida) {
        const r = registro[ev.id];
        let extra = '';
        if (r) {
          const dif = r.diferencia;
          extra = dif <= 0
            ? `<span class="ok">saliste ${r.salioA} ✓</span>`
            : `<span class="tarde">saliste ${r.salioA} (${dif} min tarde)</span>`;
        }
        const pasada = hoy.minutos > ev.minSalida && !r;
        bloque += `<div class="salida" style="${pasada ? 'opacity:.45' : ''}">🚪 Salís de casa <b>${ev.salida}</b> ${extra}</div>`;
      }
      bloque += tarjeta(ev, ahora, deHoy);
      piezas.push({ orden: ev.todoElDia ? -1 : Math.min(ev.minIni, ev.minSalida), html: bloque });
    }
    piezas.sort((a, b) => a.orden - b.orden);
    for (const p of piezas) html.push(p.html);
  }

  // ── Cierre del día ──
  const cierre = calcularCierre(EVENTOS, hoy, ahora);
  if (cierre) {
    html.push('<h2>Cierre del día</h2>');
    html.push(`<div class="destacado">
      <div class="etiqueta">${cierre.libre ? 'Mañana sin compromisos' : 'Hora tope para cortar'}</div>
      <div class="titulo">${cierre.libre ? 'Sin hora tope' : cierre.soltar + (cierre.yaPaso ? ' — ya pasó' : '')}</div>
      <div class="detalle">${esc(cierre.explicacion)}</div>
    </div>`);
  }

  // ── Cómo venís con el entrenamiento ──
  const res = resumenSemana(EVENTOS, hoy);
  if (res.total > 0) {
    html.push('<h2>Tu semana de entrenamiento</h2>');
    html.push(`<div class="semanaResumen">
      <div class="cifras">
        <div class="cifra"><b>${res.hechos}</b>cumplidos</div>
        <div class="cifra"><b>${res.reemplazados}</b>reemplazados</div>
        <div class="cifra"><b>${res.perdidos}</b>perdidos</div>
        <div class="cifra"><b>${res.sinMarcar}</b>sin marcar</div>
      </div>
    </div>`);
  }

  // ── Temas de reunión ──
  html.push(bloqueDeportes(hoy));
  html.push(bloqueReuniones(hoy));

  // ── Los próximos días ──
  html.push('<h2>Los próximos días</h2><div class="semana">');
  for (const clave of Object.keys(porDia).sort()) {
    const evs = porDia[clave];
    const p = partes(evs[0].ini);
    const limpiar = t => t.replace(/^[^\wÁÉÍÓÚáéíóúÑñ]+/, '').split('—')[0].trim();
    const deTipo = t => evs.filter(e => e.tipo === t);
    const texto = [];
    if (deTipo('entrenamiento').length) texto.push('💪 ' + deTipo('entrenamiento').map(e => limpiar(e.titulo)).join(', '));
    if (deTipo('docencia').length)      texto.push('🎓 ' + deTipo('docencia').map(e => limpiar(e.titulo)).join(', '));
    if (deTipo('familia').length)       texto.push('👨‍👩‍👧 Familia — no agendar');
    if (!texto.length) {
      const otros = evs.filter(e => e.tipo !== 'comida');
      texto.push(otros.length ? otros.map(e => limpiar(e.titulo)).join(', ') : 'Sin clases ni entrenamiento');
    }
    const r = deTipo('reunion').length;
    if (r) texto.push(`${r} ${r === 1 ? 'reunión' : 'reuniones'}`);
    const abierto = DIA_ABIERTO === clave;
    html.push(`<div class="diaSemana ${clave === hoy.clave ? 'hoy' : ''}" onclick="abrirDia('${clave}')">
      <div class="nombre">${p.diaSemana.slice(0, 3)} ${p.dia}</div>
      <div class="contenido">${esc(texto.join(' · '))}</div>
      <div class="flecha">${abierto ? '▲' : '▼'}</div>
    </div>`);
    if (abierto) html.push(detalleDelDia(evs, clave));
  }
  html.push('</div>');

  // ── Ajustes ──
  const casaLista = !!Salidas.casa();
  const notiLista = ('Notification' in window) && Notification.permission === 'granted';
  html.push(`<div class="ajustes">
    <button class="boton secundario" onclick="marcarCasa(this)">
      ${casaLista ? '📍 Casa marcada — volver a marcar' : '📍 Marcar dónde es mi casa'}</button>
    <button class="boton secundario" onclick="activarAvisos(this)">
      ${notiLista ? '🔔 Avisos activados' : '🔔 Activar avisos en este teléfono'}</button>
    <button class="boton secundario" onclick="arrancar()">↻ Actualizar</button>
    <button class="boton secundario" onclick="cambiarLink()">Cambiar el link del calendario</button>
  </div>
  <div class="pie">Se actualiza sola cada 30 segundos mientras la tengas abierta.</div>`);

  document.getElementById('app').innerHTML = html.join('');
}

function tarjeta(ev, ahora, evsDelDia) {
  const pasado = ev.fin <= ahora;
  const enCurso = ev.ini <= ahora && ev.fin > ahora;
  const hora = ev.todoElDia ? 'Todo el día' : `${ev.hhmmIni} – ${ev.hhmmFin}`;
  return `<div class="evento ${ev.tipo} ${pasado ? 'pasado' : ''} ${enCurso ? 'enCurso' : ''}">
    <div class="hora">${hora}${enCurso ? '<span class="badge">ahora</span>' : ''}</div>
    <div class="titulo">${esc(ev.deporte ? tituloDeporte(ev) : ev.titulo)}${
      ev.sinResponder ? '<span class="badge sinResp">' + (ev.quizas ? 'dijiste quizás' : 'sin responder') + '</span>' : ''}</div>
    ${ev.lugar ? `<div class="lugar">${esc(ev.lugar)}</div>` : ''}
    ${ev.descripcion ? `<div class="desc">${esc(ev.descripcion)}</div>` : ''}
    ${bloqueClases(ev)}
    ${bloqueComida(ev)}
    ${bloqueCumplimiento(ev, ahora, evsDelDia || [])}
    ${bloqueEjercicios(ev)}
  </div>`;
}

// ───────── Deportes ─────────
let DEPORTES_ABIERTO = false;
function verDeportes() {
  DEPORTES_ABIERTO = !DEPORTES_ABIERTO;
  dibujar();
}

function bloqueDeportes(hoy) {
  if (typeof deportesPorDia !== 'function') return '';
  const dias = deportesPorDia(EVENTOS, hoy.clave);
  if (!dias.length) return '';

  // Cuántos hay de cada uno, para el resumen de la cabecera
  const cuenta = {};
  for (const [, evs] of dias) for (const e of evs) {
    const q = e.deporte.quien;
    cuenta[q] = (cuenta[q] || 0) + 1;
  }
  const resumen = Object.entries(cuenta)
    .map(([q, n]) => n === 1 ? q : `${q} (${n})`).join(' · ');

  let h = '<h2>Deportes</h2>';
  h += `<div class="reuCabecera" onclick="verDeportes()">
    <div class="titulo">⚽🏎️ Lo que viene</div>
    <div class="cuenta">${esc(resumen)}</div>
    <div class="flecha">${DEPORTES_ABIERTO ? '▲' : '▼'}</div>
  </div>`;

  if (DEPORTES_ABIERTO) {
    for (const [clave, evs] of dias) {
      const cuando = cuandoEs(hoy.clave, clave);
      h += `<div class="depDia">${esc(cuando.charAt(0).toUpperCase() + cuando.slice(1))}</div>`;
      for (const e of evs) {
        h += `<div class="dep">
          <div class="depHora">${esc(e.hhmmIni)}</div>
          <div class="depQue">${esc(tituloDeporte(e))}</div>
        </div>`;
      }
    }
    h += `<div class="pie">Horarios de Argentina. Salen de los calendarios que
      seguís, así que se corrigen solos si mueven un partido.</div>`;
  }
  return h;
}

// ───────── Temas de reunión ─────────
let REUNION_ABIERTA = null;   // nombre de la reunión desplegada, o null
function verReuniones(nombre) {
  REUNION_ABIERTA = (REUNION_ABIERTA === nombre) ? null : nombre;
  dibujar();
}

function plazoTexto(dias) {
  if (dias === null) return '';
  if (dias < 0)  return `<span class="plazo rojo">venció hace ${-dias} ${-dias === 1 ? 'día' : 'días'}</span>`;
  if (dias === 0) return `<span class="plazo rojo">vence hoy</span>`;
  if (dias <= 7) return `<span class="plazo naranja">vence en ${dias} ${dias === 1 ? 'día' : 'días'}</span>`;
  return `vence en ${dias} días`;
}

function tarjetaTema(t, clase) {
  // Resaltado dorado sólo si el tema es de Marce y todavía está abierto.
  const mio = t.mio && clase !== 'cerrado';
  const etiqueta = !mio ? '' : /todos/i.test(t.responsable) ? '🫵 de todos' : '🫵 tuyo';
  return `<div class="tema ${clase} ${mio ? 'mio' : ''}">
    <div class="nombre">${esc(t.estado || '⬜')} ${esc(t.tema)}</div>
    <div class="meta">${mio ? `<span class="tuyo">${etiqueta}</span>` : ''}${esc(t.responsable || 'sin responsable')}${
      t.vence ? ' · ' + plazoTexto(t.dias) : ''}</div>
    ${t.faltas ? `<div class="falta1">⚠️ ${esc(t.faltas.join(' · '))}</div>` : ''}
    ${t.tarea ? `<div class="detalle">${esc(t.tarea)}</div>` : ''}
  </div>`;
}

function bloqueReuniones(hoy) {
  if (typeof TEMAS === 'undefined') return '';
  let h = '<h2>Temas de reunión</h2>';

  for (const nombre of REUNIONES) {
    const r = resumenReuniones(hoy.clave, nombre);
    const abierta = REUNION_ABIERTA === nombre;
    const partes = [];
    if (r.vencidos) partes.push(`<b>${r.vencidos} vencidos</b>`);
    if (r.porVencer) partes.push(`${r.porVencer} por vencer`);
    if (r.faltaCompletar) partes.push(`${r.faltaCompletar} incompletos`);
    if (r.mios) partes.push(`<span class="tuyos">🫵 ${r.mios} ${r.mios === 1 ? 'tuyo' : 'tuyos'}</span>`);

    h += `<div class="reuCabecera ${r.vencidos ? 'hayVencidos' : ''}"
            onclick="verReuniones('${esc(nombre)}')">
      <div class="titulo">📋 ${esc(nombre)}</div>
      <div class="cuenta">${partes.join(' · ') || 'todo al día'}</div>
      <div class="flecha">${abierta ? '▲' : '▼'}</div>
    </div>`;

    if (!abierta) continue;
    const g = temasPorUrgencia(hoy.clave, nombre);
    const seccion = (titulo, lista, clase) => lista.length
      ? `<div class="reuGrupo">${titulo} (${lista.length})</div>` + lista.map(t => tarjetaTema(t, clase)).join('')
      : '';
    h += seccion('🔴 Vencidos', g.vencidos, 'vencido');
    h += seccion('🟠 Por vencer esta semana', g.porVencer, 'pronto');
    h += seccion('⚠️ Falta completar', g.faltaCompletar, 'falta');
    h += seccion('▶️ En marcha', g.enMarcha, '');
    h += seccion('✅ Cerrados esta semana', g.cerrados, 'cerrado');
  }
  h += `<div class="pie">Leído de los libros de actas de Canva · ${esc(REUNIONES_ACTUALIZADO)}</div>`;
  return h;
}

// ───────── Días futuros: tocar para ver el detalle ─────────
let DIA_ABIERTO = null;

function abrirDia(clave) {
  DIA_ABIERTO = (DIA_ABIERTO === clave) ? null : clave;
  dibujar();
}

function detalleDelDia(evs, clave) {
  const conHora = evs.filter(e => !e.todoElDia).sort((a, b) => a.minIni - b.minIni);
  if (!conHora.length) return `<div class="detalleDia">Sin nada agendado.</div>`;
  let h = '<div class="detalleDia">';
  for (const e of conHora) {
    const clases = (typeof clasesDelDia === 'function' && SEDE_POR_LUGAR[e.lugar])
      ? clasesDelDia(clave).filter(c => SEDE_POR_LUGAR[e.lugar].indexOf(c.sedeCod) !== -1)
      : [];
    const mio = clases.find(c => c.esMio);
    h += `<div class="linea"><b>${e.hhmmIni}</b><span>${esc(e.titulo)}${
      mio ? ' — <b>' + esc(mio.tema) + '</b>' : ''}</span></div>`;
    if (e.salida) h += `<div class="linea"><b></b><span class="sal">🚪 salís ${e.salida}</span></div>`;
  }
  return h + '</div>';
}

// ───────── Ejercicios de la rutina ─────────
let EJERCICIOS_ABIERTOS = false;

function bloqueEjercicios(ev) {
  if (typeof EJERCICIOS === 'undefined') return '';
  // Sólo en musculación: natación, zumba y trote no usan la rutina de sala.
  if (!/musculaci/i.test(ev.titulo)) return '';

  if (!EJERCICIOS_ABIERTOS) {
    return `<div class="cumplio">
      <button onclick="verEjercicios()">🏋️ Ver los ejercicios</button></div>`;
  }
  const grupos = ejerciciosPorGrupo();
  let h = '<div class="ejercicios">';
  for (const g of Object.keys(grupos)) {
    h += `<div class="ejGrupo">${esc(g)}</div>`;
    for (const e of grupos[g]) {
      h += `<a href="${esc(videoDe(e.nombre))}" target="_blank" rel="noopener">
        <span>${esc(e.nombre)}</span><span class="play">▶ ver</span></a>`;
    }
  }
  h += `<div class="cumplio"><button onclick="verEjercicios()">Ocultar</button></div></div>`;
  return h;
}
function verEjercicios() { EJERCICIOS_ABIERTOS = !EJERCICIOS_ABIERTOS; dibujar(); }

// ───────── ¿Lo hiciste? y los planes B/C si no ─────────
let PLANES_ABIERTOS = null;   // id del entrenamiento cuyos planes están desplegados

function bloqueCumplimiento(ev, ahora, evsDelDia) {
  if (ev.tipo !== 'entrenamiento') return '';
  const hoy = partes(ahora);
  if (ev.clave !== hoy.clave) return '';
  if (ev.ini > ahora) return '';                 // todavía no empezó

  const r = estadoEntrenamiento(ev);
  if (r) {
    const clase = r.estado === 'hecho' ? 'ok' : (r.estado === 'reemplazado' ? 'alt' : 'perd');
    const texto = r.estado === 'hecho' ? '✓ Lo hiciste'
                : r.estado === 'reemplazado' ? '↔ Reemplazado por ' + esc(r.detalle)
                : '— Quedó sin hacer';
    return `<div class="marcado ${clase}">${texto}
      <button onclick="desmarcar('${esc(ev.id)}')">cambiar</button></div>`;
  }

  if (PLANES_ABIERTOS === ev.id) {
    const planes = planesPara(ev, evsDelDia, hoy);
    return `<div class="planes">` + planes.map((p, i) => `
      <button class="plan" onclick="elegirPlan('${esc(ev.id)}', ${i})">
        <div class="letra">${p.letra}</div>
        <div>
          <div class="que">${esc(p.que)}</div>
          <div class="cuando">${esc(p.cuando)}</div>
          <div class="porque">${esc(p.porque)}</div>
        </div>
      </button>`).join('') + `</div>`;
  }

  return `<div class="cumplio">
    <button class="si" onclick="marcarHecho('${esc(ev.id)}')">✓ Lo hice</button>
    <button class="no" onclick="abrirPlanes('${esc(ev.id)}')">No llegué — ¿qué hago?</button>
  </div>`;
}

function buscarEvento(id) { return EVENTOS.find(e => e.id === id); }

function marcarHecho(id) {
  const ev = buscarEvento(id);
  if (ev) { marcarEntrenamiento(ev, 'hecho'); PLANES_ABIERTOS = null; dibujar(); }
}
function abrirPlanes(id) { PLANES_ABIERTOS = id; dibujar(); }
function desmarcar(id) {
  const reg = registroEntrenamientos();
  delete reg[id];
  Guardado.escribir('cumplimiento', reg);
  PLANES_ABIERTOS = null;
  dibujar();
}
function elegirPlan(id, i) {
  const ev = buscarEvento(id);
  if (!ev) return;
  const hoy = partes(new Date());
  const delDia = EVENTOS.filter(e => e.clave === hoy.clave);
  const p = planesPara(ev, delDia, hoy)[i];
  if (!p) return;
  if (/anotarlo como no cumplido/i.test(p.que)) marcarEntrenamiento(ev, 'no');
  else marcarEntrenamiento(ev, 'reemplazado', p.que + ' (' + p.cuando + ')');
  PLANES_ABIERTOS = null;
  dibujar();
}

// Qué cocinar hoy al mediodía
function bloqueComida(ev) {
  const s = sugerenciaDeComida(ev);
  if (!s) return '';
  const p = s.plato;
  return `<div class="comidaSug">
    <div class="quien">Hoy cociná${p.diaLargo ? ' · día largo, que rinda' : ''}</div>
    <div class="plato">${esc(p.nombre)}</div>
    <div class="datos">~${p.proteina} g de proteína · ${p.minutos} min de cocción · para 2</div>
    <div class="datos">${esc(s.horarios)}</div>
    <div class="otra">🛒 ${esc(p.ingredientes)}</div>
    <div class="pasos">${esc(p.pasos)}</div>
  </div>`;
}

// Qué se da en ese evento: tu clase, o quién la da si no te toca
function bloqueClases(ev) {
  const clases = programaDeEvento(ev);
  if (!clases.length) return '';
  return clases.map(c => {
    const cursada = c.sede ? c.sede.detalle : '';
    return `<div class="clase ${c.esMio ? 'mia' : 'otro'}">
      <div class="quien">${c.esMio ? '★ Te toca a vos' : 'Da ' + esc(c.responsable)}${
        cursada ? ' · ' + esc(cursada) : ''}</div>
      ${(c.cubreA && c.cubreA !== YO) ? '<div class="cubre">🔄 Cubre a ' + esc(c.cubreA) + ', que hoy da en FLACSO.</div>' : ''}
      <div class="tema">${esc(c.tema)}</div>
      ${c.unidad ? `<div class="meta">Unidad ${esc(c.unidad.replace('U','').replace('-',' · clase '))}</div>` : ''}
    </div>`;
  }).join('');
}

function marcarCasa(boton) {
  boton.textContent = '📍 Leyendo tu ubicación…';
  boton.disabled = true;
  Salidas.marcarCasa(error => {
    boton.disabled = false;
    if (error) { boton.textContent = '⚠️ ' + error; }
    else { dibujar(); }
  });
}

function activarAvisos(boton) {
  pedirPermisoNotificaciones().then(r => {
    if (r === 'granted') dibujar();
    else boton.textContent = '⚠️ Los avisos quedaron bloqueados. Habilitalos en los permisos del sitio.';
  });
}

arrancar();

// Instalable y con funcionamiento sin internet (solo sobre https)
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// Al volver a la app después de tenerla en segundo plano, refrescar enseguida
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && EVENTOS.length) dibujar();
});
</script>
</body>
